<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Webster Taxi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#8a8a8e);--btn:var(--tg-theme-button-color,#2481cc);--btx:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f1f3f5)}
@media (prefers-color-scheme:dark){:root{--bg:var(--tg-theme-bg-color,#17212b);--tx:var(--tg-theme-text-color,#f5f5f5);--card:var(--tg-theme-secondary-bg-color,#232e3c)}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:18px 16px 28px}
.logo{display:block;width:104px;height:104px;border-radius:50%;object-fit:cover;margin:6px auto 10px;box-shadow:0 0 26px rgba(255,140,0,.35)}
h1{font-size:24px;text-align:center;margin:0 0 4px;letter-spacing:.3px}
.sub{text-align:center;font-size:14px;color:var(--hint);margin:0 0 18px}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:9px 14px}
.row+.row{border-top:1px solid rgba(128,128,128,.22)}
.ico{font-size:18px}
.f{flex:1;min-width:0}
label{display:block;font-size:12px;color:var(--hint)}
input{width:100%;border:0;background:transparent;color:var(--tx);font-size:16px;font-weight:600;padding:2px 0;outline:none}
input::placeholder{font-style:italic;font-weight:300;color:var(--hint);opacity:.7}
.hint{font-size:12px;color:var(--hint);min-height:16px;margin:6px 4px 0}
button{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;background:var(--btn);color:var(--btx);margin-top:10px}
button:disabled{opacity:.5}
.res{background:var(--card);border-radius:14px;padding:12px 16px;margin-top:12px}
.price{font-size:30px;font-weight:700}
.err{color:#d93025;margin-top:10px;font-size:14px;text-align:center}
</style>
</head>
<body>
<img class="logo" src="WebsterLogo.jpg" alt="" onerror="this.style.display='none'">
<h1>Webster Taxi</h1>
<p class="sub">Вітаємо Вас! 🚕 Вкажіть, куди поїдемо</p>

<div class="group">
  <div class="row">
    <span class="ico">📍</span>
    <div class="f"><label>Звідки</label><input id="from" placeholder="Вулиця та номер будинку" autocomplete="off"></div>
  </div>
  <div class="row">
    <span class="ico">🏁</span>
    <div class="f"><label>Куди</label><input id="to" placeholder="Наприклад: вулиця Заводська 50" autocomplete="off"></div>
  </div>
</div>
<div class="hint" id="fromHint"></div>

<button id="calcBtn" onclick="calc()">Розрахувати вартість</button>

<div id="res" style="display:none">
  <div class="res">
    <label>💰 Вартість поїздки</label>
    <div class="price" id="price"></div>
    <div class="hint" id="dist" style="margin:2px 0 0"></div>
  </div>
  <button id="orderBtn" onclick="order()">✅ Замовити таксі</button>
</div>

<div class="err" id="err"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const inTG = !!(tg && tg.initData);
const $ = id => document.getElementById(id);
let from = null, result = null;

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const sleep = ms => new Promise(s => setTimeout(s, ms));

function shortAddr(a) {
  const street = a.road || a.pedestrian || a.footway || "";
  const house = a.house_number || "";
  const city = a.city || a.town || a.village || "";
  return [[street, house].filter(Boolean).join(" "), city].filter(Boolean).join(", ");
}

function locate() {
  $("fromHint").textContent = "Визначаємо ваше місцезнаходження…";
  if (!navigator.geolocation) {
    $("fromHint").textContent = "Геолокація недоступна — введіть адресу вручну";
    return;
  }
  navigator.geolocation.getCurrentPosition(async p => {
    from = { lat: p.coords.latitude, lon: p.coords.longitude };
    try {
      const d = await getJSON("https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=uk&lat=" + from.lat + "&lon=" + from.lon);
      $("from").value = shortAddr(d.address || {});
      $("fromHint").textContent = "Визначено за геолокацією";
    } catch (e) {
      $("fromHint").textContent = "Координати отримано, адресу не визначено — введіть вручну";
    }
  }, () => {
    $("fromHint").textContent = "Не вдалося визначити місце — введіть адресу вручну";
  }, { enableHighAccuracy: true, timeout: 15000 });
}

async function geocode(text, near) {
  const base = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=uk&q=" + encodeURIComponent(text);
  const tries = near
    ? [base + "&viewbox=" + (near.lon - 0.3) + "," + (near.lat + 0.3) + "," + (near.lon + 0.3) + "," + (near.lat - 0.3) + "&bounded=1", base]
    : [base];
  for (const u of tries) {
    const r = await getJSON(u);
    if (r.length) return { lat: +r[0].lat, lon: +r[0].lon };
    await sleep(1000);
  }
  return null;
}

async function routeKm(a, b) {
  try {
    const d = await getJSON("https://router.project-osrm.org/route/v1/driving/" + a.lon + "," + a.lat + ";" + b.lon + "," + b.lat + "?overview=false");
    return d.routes[0].distance / 1000;
  } catch (e) {
    const p = Math.PI / 180;
    const h = Math.sin((b.lat - a.lat) * p / 2) ** 2 + Math.cos(a.lat * p) * Math.cos(b.lat * p) * Math.sin((b.lon - a.lon) * p / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(h)) * 1.3;
  }
}

const priceFor = km => 150 + Math.ceil(Math.max(0, km - 2) * 2) * 8;

async function calc() {
  const fromText = $("from").value.trim(), toText = $("to").value.trim();
  $("err").textContent = "";
  $("res").style.display = "none";
  if (!fromText || !toText) { $("err").textContent = "Введіть обидві адреси."; return; }
  $("calcBtn").disabled = true;
  $("calcBtn").textContent = "⏳ Хвилинку, рахуємо вартість…";
  try {
    let a = from || await geocode(fromText, null);
    if (!a) { $("err").textContent = "⚠️ Можливо, адреси подачі не існує."; return; }
    const b = await geocode(toText, a);
    if (!b) { $("err").textContent = "⚠️ Можливо, такої адреси не існує. Перевірте та спробуйте ще раз."; return; }
    const km = await routeKm(a, b);
    result = { from: fromText, to: toText, km: Math.round(km * 10) / 10, price: priceFor(km), lat: a.lat, lon: a.lon };
    $("price").textContent = "~" + result.price + " грн";
    $("dist").textContent = "Відстань: ~" + result.km + " км";
    $("res").style.display = "block";
    $("res").scrollIntoView({ behavior: "smooth", block: "end" });
  } catch (e) {
    $("err").textContent = "Не вдалося розрахувати. Перевірте інтернет і спробуйте ще раз.";
  } finally {
    $("calcBtn").disabled = false;
    $("calcBtn").textContent = "Розрахувати вартість";
  }
}

function order() {
  if (!result) return;
  if (inTG) {
    tg.sendData(JSON.stringify(result));
    return;
  }
  alert("Тест у браузері: замовлення не надсилається.\n\n" + result.from + " → " + result.to + "\n~" + result.km + " км, ~" + result.price + " грн\n\nУсередині Telegram ця кнопка надішле замовлення боту.");
}

$("from").addEventListener("input", () => { from = null; $("fromHint").textContent = ""; });
locate();
</script>
</body>
</html>
