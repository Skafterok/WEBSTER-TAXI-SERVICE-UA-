/* Фон і картки задані самі (нейтральний сірий), не залежать від теми Telegram. Змінити колір фону: --bg */
:root{--bg:#2b2e33;--card:#383c43;--tx:#f2f2f2;--hint:#a3a7ae;--btn:#2481cc;--btx:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:12px 14px 90px}
button{font-family:inherit}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}

.bar i{display:block;height:100%;width:0;background:var(--btn);transition:width .9s linear}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:600;background:var(--btn);color:var(--btx);margin-top:8px;text-align:center;text-decoration:none}
.btn.sec{background:transparent;color:var(--btn);border:1px solid var(--btn);font-size:14px;padding:9px}

nav button{flex:1;border:0;background:transparent;color:var(--hint);font-size:12px;padding:4px 0}

nav .ic{display:block;font-size:20px}
h1{font-size:22px;text-align:center;margin:0 0 4px}
.sub{text-align:center;font-size:14px;color:var(--hint);margin:0 0 14px}
.group{background:var(--card);border-radius:14px;overflow:hidden}

label{display:block;font-size:12px;color:var(--hint)}

/* Картка в ефірі: ширша (виходить за поля екрана) і шрифт на ~20% більший */

/* Державний номер України (ескіз за фото): -40% і ще -7%; прапор і UA рознесені (прапор угорі, UA внизу) */

.plate .ua{flex:none;position:relative;width:18px;background:#0a4ea3;color:#fff;font:800 7px/1 "Barlow",Arial,sans-serif}
.plate .fl{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:13px;height:8px;background:linear-gradient(#3a8fe0 50%,#ffd500 50%)}

/* Фото авто */
.carph{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;object-fit:cover;background:#2f3238;margin-bottom:8px}

/* Перемикач Онлайн / Офлайн */
.sw{position:relative;flex:none;width:116px;height:36px;border:0;border-radius:18px;background:#6b2430;transition:background .25s;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}

/* Мініатюра фото авто поруч з даними водія */
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dtxt{flex:1;min-width:0}
.carsm{flex:none;width:112px;aspect-ratio:16/9;border-radius:10px;object-fit:cover;background:#2f3238;display:block;margin-top:10px}
div.carsm{position:relative;overflow:hidden}
div.carsm svg{position:absolute;inset:0;width:100%;height:100%}
#zoom{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.zi{position:relative;width:min(86vw,360px)}
.zi img,.zph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#2f3238}

.zph svg{position:absolute;inset:0;width:100%;height:100%}
.zc{position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
.tp{background:#2c3b57}
.carbig{width:92vw;max-width:560px;aspect-ratio:16/9;border-radius:14px;object-fit:cover;background:#2f3238}
div.carbig{display:flex;align-items:center;justify-content:center}
div.carbig svg{width:70%;height:auto}

<div class="top"><img src="WebsterLogo.jpg" alt="" onerror="this.style.display='none'"><b>Webster Taxi</b><span id="net" class="lbl" style="margin-left:auto"></span></div>

<script>
"use strict";
/* ================================================================
   WEBSTER TAXI — клієнтський застосунок (тестова версія, цикл 3)
   Шари:  CONFIG → утиліти → Session → Store → Timing/Tariff → Geo →
          Orders (бізнес-логіка) → Views (пасажир / водій) → UI → Actions
   Усі дані зараз у localStorage. Для сервера достатньо замінити
   Store (і Geo за потреби) на реалізацію з тим самим інтерфейсом.
   Мова: лише українська (англійська — у відкладених завданнях).
   ================================================================ */

/* ---------- 1. Конфігурація ---------- */
const CONFIG = {
  tariff: {basePrice: 150, baseKm: 2, perKm: 16},   // ₴ 150 за перші 2 км, далі ₴ 16/км (0,5 км = ₴ 8)
  avgSpeedKmh: 25,                                  // для тривалості поїздки в емуляції
  etaOptions: [3, 5, 10],                           // варіанти «буду через N хв»
  wait: {freeSec: 180, perMin: 4, stepSec: 15, lateSec: 240},     // 3 хв безкоштовно, далі ₴ 4/хв, сума оновлюється кожні 15 с
  supabaseUrl: "https://lqjenraibndhaomxflns.supabase.co",   // сервер (Supabase): публічні дані проєкту, ключ «publishable» безпечний для застосунку
  supabaseKey: "sb_publishable_xwa0dAVHlO6CVsu7rnbgBQ_zyEA-T86",
  pollMs: 3000,                                      // як часто застосунок опитує сервер (пізніше замінимо на Realtime)
  arriveMeters: 50,                                  // «На місці» доступна, якщо водій не далі 50 м від точки подачі (у демо-режимі перевірка вимкнена)
  discountEta: 10, discountPct: 5,                   // подача за 10 хв: пасажиру пропонується знижка 5%
  commissionPct: 10,                                // ТЕСТОВИЙ відсоток комісії платформи (остаточний розмір ще не вирішено)
  speedOptions: [1, 5, 20],                         // прискорення часу в демо
  defaultLoc: {lat: 48.4647, lon: 35.0462},         // центр Дніпра
  storageKey: "wt_demo_v2",
  offlineFallback: true,                            // тестовий розрахунок без інтернету
  bgColor: "#2b2e33"                                // має збігатися з --bg у CSS (колір шапки Telegram)
};

/* ---------- 2. Утиліти ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rad = Math.PI / 180;
const hav = (a, b) => {
  const h = Math.sin((b.lat - a.lat) * rad / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin((b.lon - a.lon) * rad / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
};
const roadKm = (a, b) => hav(a, b) * 1.3;
const num1 = k => (Math.round(k * 10) / 10).toFixed(1).replace(".", ",");
const fmtKm = k => num1(k) + " км";
const fmtT = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const hhmm = t => new Date(t).toLocaleTimeString("uk-UA", {hour: "2-digit", minute: "2-digit"});
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const telHref = p => "tel:" + String(p).replace(/[^+\d]/g, "");
const notify = msg => {
  const w = window.Telegram && window.Telegram.WebApp;
  try { if (w && w.showAlert) { w.showAlert(msg); return; } } catch (e) {}
  alert(msg);
};

/* ---------- 3. Сесія: роль і вкладки ---------- */
// TODO(server): роль визначатиметься за Telegram ID та статусом підтвердження водія, а не за параметром адреси.
const Q = new URLSearchParams(location.search);
const Session = {
  demo: Q.get("demo") === "1",                       // ?demo=1 — обидві ролі з перемикачем
  role: Q.get("role") === "driver" ? "drv" : "pass", // ?role=driver — кабінет водія; інакше — пасажир
  tab: {pass: "order", drv: "air"}
};
const TG = (() => {
  const w = window.Telegram && window.Telegram.WebApp;
  if (w) {
    try { w.ready(); w.expand(); } catch (e) {}
    try { w.setHeaderColor(CONFIG.bgColor); w.setBackgroundColor(CONFIG.bgColor); } catch (e) {}
  }
  const u = w && w.initDataUnsafe && w.initDataUnsafe.user;
  return {webapp: w, name: u && u.first_name ? u.first_name : "Пасажир (демо)"};
})();

const ME = (() => {                      // ідентифікатор користувача: Telegram ID, а в браузері — випадковий код пристрою
  const w = window.Telegram && window.Telegram.WebApp, u = w && w.initDataUnsafe && w.initDataUnsafe.user;
  if (u && u.id) return "tg" + u.id;
  let id = ""; try { id = localStorage.getItem("wt_uid") || ""; } catch (e) {}
  if (!id) { id = "u" + Math.random().toString(36).slice(2, 10); try { localStorage.setItem("wt_uid", id); } catch (e) {} }
  return id;
})();

/* ---------- 4. Сховище (адаптер). Інтерфейс: get / update / subscribe ---------- */
const LocalStore = {
  _s: null, _subs: [],
  _default: () => ({orders: [], seq: 1, speed: 1, loc: Object.assign({}, CONFIG.defaultLoc),
    online: true, balance: 1000, favorites: [], excluded: [], stats: {}, notices: [], pnotices: [], compliments: 0, blacklist: [], blOn: false,
    driver: {id: "d1", name: "Олег (демо)", car: "Toyota Camry", color: "білий", plate: "AA 0888 TK", phone: "+380 50 000 00 00", photo: ""}}),
  _read() {
    try { return Object.assign(this._default(), JSON.parse(localStorage.getItem(CONFIG.storageKey) || "{}")); }
    catch (e) { return this._default(); }
  },
  get() { if (!this._s) this._s = this._read(); return this._s; },
  async update(fn) {                    // читає свіжий стан → змінює → зберігає → сповіщає
    const s = this._read();
    const result = fn(s);
    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(s)); } catch (e) {}
    this._s = s; this._emit();
    return result;
  },
  subscribe(cb) { this._subs.push(cb); },
  _emit() { this._subs.forEach(cb => { try { cb(this._s); } catch (e) {} }); },
  init() {                              // синхронізація між вкладками (пасажир і водій у різних вкладках)
    window.addEventListener("storage", e => { if (e.key === CONFIG.storageKey) { this._s = this._read(); this._emit(); } });
  }
};
LocalStore.remote = null;
LocalStore.refresh = async () => {};

/* ----- Сервер (Supabase REST). Той самий інтерфейс get / update / subscribe, дані спільні для всіх пристроїв ----- */
const SB = {
  async call(method, path, body, prefer) {
    const h = {apikey: CONFIG.supabaseKey, "Content-Type": "application/json"};
    if (prefer) h.Prefer = prefer;
    const r = await fetch(CONFIG.supabaseUrl + "/rest/v1/" + path, {method, headers: h, body: body === undefined ? undefined : JSON.stringify(body)});
    const t = await r.text();
    if (!r.ok) throw new Error(method + " " + path.split("?")[0] + ": " + r.status + " " + t.slice(0, 160));
    return t ? JSON.parse(t) : null;
  }
};
const msOf = v => v ? new Date(v).getTime() : undefined;
const isoOf = v => v ? new Date(v).toISOString() : null;
const nz = v => v == null ? undefined : v;
const rowToOrder = r => ({
  id: r.id, mine: r.passenger_id === ME, mineDrv: r.driver_id === ME,
  client: {id: r.passenger_id, name: r.passenger_name, phone: r.passenger_phone},
  from: {text: r.from_text, lat: r.from_lat, lon: r.from_lon}, to: {text: r.to_text},
  km: +r.km, price: r.price, origPrice: nz(r.orig_price), discount: nz(r.discount), offerPrice: nz(r.offer_price),
  status: r.status, eta: nz(r.eta), driver: r.driver || undefined, driverId: r.driver_id || undefined,
  acceptedAt: msOf(r.accepted_at), arrivedAt: msOf(r.arrived_at), startedAt: msOf(r.started_at), doneAt: msOf(r.done_at), created: msOf(r.created_at),
  waitFee: r.wait_fee || 0, fare: nz(r.fare), commission: nz(r.commission), compliment: !!r.compliment, cancelledBy: r.cancelled_by || undefined
});
const orderToRow = o => ({
  passenger_id: (o.client && o.client.id) || ME, passenger_name: o.client && o.client.name, passenger_phone: o.client && o.client.phone,
  from_text: o.from && o.from.text, from_lat: o.from && o.from.lat, from_lon: o.from && o.from.lon, to_text: o.to && o.to.text,
  km: o.km, price: o.price, orig_price: nz(o.origPrice) === undefined ? null : o.origPrice, discount: nz(o.discount) === undefined ? null : o.discount,
  offer_price: nz(o.offerPrice) === undefined ? null : o.offerPrice, status: o.status, eta: nz(o.eta) === undefined ? null : o.eta,
  driver_id: o.driver ? o.driver.id : null, driver: o.driver || null,
  accepted_at: isoOf(o.acceptedAt), arrived_at: isoOf(o.arrivedAt), started_at: isoOf(o.startedAt), done_at: isoOf(o.doneAt),
  wait_fee: o.waitFee || 0, fare: nz(o.fare) === undefined ? null : o.fare, commission: nz(o.commission) === undefined ? null : o.commission,
  compliment: !!o.compliment, cancelled_by: o.cancelledBy || null
});
const rowDiff = (a, b) => { const d = {}; for (const k in b) if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) d[k] = b[k]; return d; };

const RemoteStore = {
  remote: null, _s: null, _subs: [], _q: Promise.resolve(), _hash: "", _photos: false, _creating: false, ok: true, err: "",
  _local() { try { return JSON.parse(localStorage.getItem("wt_local_v1") || "{}"); } catch (e) { return {}; } },
  _saveLocal(s) { try { localStorage.setItem("wt_local_v1", JSON.stringify({speed: s.speed, loc: s.loc, blOn: s.blOn, seq: s.seq})); } catch (e) {} },
  _blank() {
    const d = LocalStore._default(), l = this._local();
    Object.assign(d, {speed: l.speed || 1, loc: l.loc || d.loc, blOn: !!l.blOn, seq: l.seq || 1, excludedBy: [], drivers: {}});
    d.driver = Object.assign({}, d.driver, {id: ME, photos: {}});
    return d;
  },
  get() { return this._s || (this._s = this._blank()); },
  subscribe(cb) { this._subs.push(cb); },
  _emit() {
    const n = $("net"); if (n) { n.textContent = this.ok ? "🟢 Сервер" : "🔴 Немає зв'язку"; n.title = this.err; }
    this._subs.forEach(cb => { try { cb(this._s); } catch (e) {} });
  },
  _fail(e) { this.ok = false; this.err = String(e && e.message || e); this._emit(); },
  async pull() {                         // завантажує свіжий стан із сервера; повертає true, якщо щось змінилося
    const s = this.get();
    const [orders, me, notes, prefs, bl, exb] = await Promise.all([
      SB.call("GET", "wt_orders?select=*&order=id.desc&limit=100"),
      SB.call("GET", "wt_drivers?id=eq." + ME + "&select=id,name,car,color,plate,phone,online,balance,fav_count,ex_count"),
      SB.call("GET", "wt_notices?or=(to_id.eq.drv:" + ME + ",to_id.eq.pas:" + ME + ")&select=*&order=id"),
      SB.call("GET", "wt_prefs?passenger_id=eq." + ME + "&select=*"),
      SB.call("GET", "wt_blacklist?driver_id=eq." + ME + "&select=*"),
      SB.call("GET", "wt_prefs?driver_id=eq." + ME + "&kind=eq.ex&select=passenger_id")
    ]);
    if (!me.length) {                    // перший запуск на цьому пристрої: створюємо запис водія
      if (this._creating) throw new Error("не вдалося створити запис водія");
      this._creating = true;
      const d = s.driver;
      await SB.call("POST", "wt_drivers", {id: ME, name: d.name, car: d.car, color: d.color, plate: d.plate, phone: d.phone, photos: {}, online: true, balance: 1000}, "resolution=merge-duplicates,return=minimal");
      try { return await this.pull(); } finally { this._creating = false; }
    }
    let changed = false;
    if (!this._photos) {                 // власні фото авто завантажуємо один раз
      const ph = await SB.call("GET", "wt_drivers?id=eq." + ME + "&select=photos");
      s.driver.photos = (ph[0] && ph[0].photos) || {}; s.driver.photo = s.driver.photos.front || ""; this._photos = true; changed = true;
    }
    const ids = [...new Set(orders.map(rowToOrder).filter(o => o.mine && o.driverId && o.driverId !== ME && !s.drivers[o.driverId]).map(o => o.driverId))];
    if (ids.length) {                    // фото водіїв, які везуть мене
      const rows = await SB.call("GET", "wt_drivers?id=in.(" + ids.join(",") + ")&select=id,photos");
      rows.forEach(r => { s.drivers[r.id] = {photos: r.photos || {}}; }); changed = true;
    }
    const hash = JSON.stringify([orders, me[0], notes, prefs, bl, exb]);
    if (hash === this._hash && !changed) return false;
    this._hash = hash;
    const m = me[0];
    s.orders = orders.map(rowToOrder);
    Object.assign(s.driver, {id: ME, name: m.name, car: m.car, color: m.color, plate: m.plate, phone: m.phone});
    s.online = m.online; s.balance = +m.balance;
    s.stats = {}; s.stats[ME] = {fav: m.fav_count, ex: m.ex_count};
    s.favorites = prefs.filter(p => p.kind === "fav").map(p => p.driver_id);
    s.excluded = prefs.filter(p => p.kind === "ex").map(p => p.driver_id);
    s.excludedBy = exb.map(p => p.passenger_id);
    s.blacklist = bl.map(b => b.passenger_id);
    s.notices = notes.filter(n => n.to_id === "drv:" + ME).map(n => ({id: n.id, text: n.text}));
    s.pnotices = notes.filter(n => n.to_id === "pas:" + ME).map(n => ({id: n.id, text: n.text}));
    this.ok = true; this._emit();
    return true;
  },
  _drow: s => ({name: s.driver.name, car: s.driver.car, color: s.driver.color, plate: s.driver.plate, phone: s.driver.phone, photos: s.driver.photos || {}, online: s.online, balance: s.balance}),
  _snap(s) { return {o: new Map(s.orders.map(o => [o.id, orderToRow(o)])), d: this._drow(s)}; },
  async _push(before, s) {               // відправляє на сервер лише те, що змінилося
    for (const o of s.orders) {
      if (o.id < 0) {                    // нове замовлення (тимчасовий від'ємний id)
        const row = orderToRow(o); if (o.created) row.created_at = isoOf(o.created);
        await SB.call("POST", "wt_orders", row, "return=minimal");
      } else {
        const old = before.o.get(o.id); if (!old) continue;
        const d = rowDiff(old, orderToRow(o));
        if (Object.keys(d).length) await SB.call("PATCH", "wt_orders?id=eq." + o.id, d, "return=minimal");
      }
    }
    const dd = rowDiff(before.d, this._drow(s));
    if (Object.keys(dd).length) await SB.call("PATCH", "wt_drivers?id=eq." + ME, dd, "return=minimal");
  },
  update(fn) {                           // свіжий стан із сервера → зміна → запис змін → сповіщення
    const run = async () => {
      try { await this.pull(); } catch (e) { this._fail(e); }
      const s = this.get(), before = this._snap(s), result = fn(s);
      try { await this._push(before, s); } catch (e) { this._fail(e); }
      this._saveLocal(s);
      try { this._hash = ""; await this.pull(); } catch (e) { this._fail(e); }
      this._emit();
      return result;
    };
    const p = this._q.then(run, run); this._q = p.catch(() => {}); return p;
  },
  refresh(force) {
    const run = async () => { if (force) this._hash = ""; try { await this.pull(); } catch (e) { this._fail(e); } };
    const p = this._q.then(run, run); this._q = p.catch(() => {}); return p;
  },
  init() { this.refresh(); setInterval(() => this.refresh(), CONFIG.pollMs); }
};
RemoteStore.remote = {
  async accept(id, driverId, eta, asOffer) {   // атомарне «захоплення» замовлення: повертає null, якщо його вже взяв інший водій
    const r = await SB.call("POST", "rpc/wt_accept_order", {p_order: id, p_driver: driverId, p_eta: eta, p_offer: asOffer});
    return r && r.id ? r : null;
  },
  notify: (toId, text) => SB.call("POST", "wt_notices", {to_id: toId, text}, "return=minimal"),
  del: (table, filter) => SB.call("DELETE", table + "?" + filter, undefined, "return=minimal"),
  async prefer(me, key, kind) {
    const cur = await SB.call("GET", "wt_prefs?passenger_id=eq." + me + "&driver_id=eq." + key + "&select=kind");
    const prev = cur[0] && cur[0].kind;
    if (prev === kind) return false;
    await SB.call("POST", "wt_prefs?on_conflict=passenger_id,driver_id", {passenger_id: me, driver_id: key, kind}, "resolution=merge-duplicates,return=minimal");
    const d = (await SB.call("GET", "wt_drivers?id=eq." + key + "&select=fav_count,ex_count"))[0];
    if (d) {
      let f = d.fav_count, x = d.ex_count;
      if (prev === "fav") f = Math.max(0, f - 1);
      if (prev === "ex") x = Math.max(0, x - 1);
      if (kind === "fav") f++; else x++;
      await SB.call("PATCH", "wt_drivers?id=eq." + key, {fav_count: f, ex_count: x}, "return=minimal");
    }
    return true;
  },
  blAdd: pid => SB.call("POST", "wt_blacklist?on_conflict=driver_id,passenger_id", {driver_id: ME, passenger_id: pid}, "resolution=merge-duplicates,return=minimal"),
  blDel: pid => SB.call("DELETE", "wt_blacklist?driver_id=eq." + ME + "&passenger_id=eq." + pid, undefined, "return=minimal"),
  async reset() {
    await SB.call("DELETE", "wt_orders?or=(passenger_id.eq." + ME + ",driver_id.eq." + ME + ",passenger_id.like.fake*)", undefined, "return=minimal");
    await SB.call("DELETE", "wt_notices?or=(to_id.eq.drv:" + ME + ",to_id.eq.pas:" + ME + ")", undefined, "return=minimal");
    await SB.call("DELETE", "wt_prefs?passenger_id=eq." + ME, undefined, "return=minimal");
    await SB.call("DELETE", "wt_blacklist?driver_id=eq." + ME, undefined, "return=minimal");
    await SB.call("PATCH", "wt_drivers?id=eq." + ME, {online: true, balance: 1000, fav_count: 0, ex_count: 0}, "return=minimal");
  }
};

/* ---------- 5. Тариф і таймінги ---------- */
const Tariff = {
  price(km) {
    const t = CONFIG.tariff;
    return t.basePrice + Math.ceil(Math.max(0, km - t.baseKm) * 2) * (t.perKm / 2);
  }
};
const Timing = {
  speed: () => Store.get().speed || 1,
  rideMin: o => Math.max(3, Math.round(o.km / CONFIG.avgSpeedKmh * 60)),
  arrLeft: (o, sp = Timing.speed()) => Math.max(0, o.eta * 60 - (Date.now() - o.acceptedAt) / 1000 * sp),
  rideLeft: (o, sp = Timing.speed()) => Math.max(0, Timing.rideMin(o) * 60 - (Date.now() - o.startedAt) / 1000 * sp),
  // Кнопка «На місці» стає активною не раніше, ніж через половину заданого часу подачі (3→1 хв, 5→2 хв, 10→5 хв)
  unlockSec: o => Math.floor(o.eta / 2) * 60,
  elapsed: (o, sp = Timing.speed()) => (Date.now() - o.acceptedAt) / 1000 * sp,
  canArrive: (o, sp = Timing.speed()) => Timing.elapsed(o, sp) >= Timing.unlockSec(o),
  waitSec: (o, sp = Timing.speed()) => Math.max(0, (Date.now() - (o.arrivedAt || Date.now())) / 1000 * sp),
  waitInfo(o, sp = Timing.speed()) {
    const w = CONFIG.wait, t = Timing.waitSec(o, sp), idle = Math.max(0, t - w.freeSec);
    return {free: t < w.freeSec, left: Math.max(0, w.freeSec - t), idle, fee: Math.floor(idle / w.stepSec) * (w.perMin / 60 * w.stepSec)};
  },
  defEta: d => CONFIG.etaOptions.reduce((p, c) => Math.abs(c - d * 2.4) < Math.abs(p - d * 2.4) ? c : p)
};

/* ---------- 6. Геосервіс (карти). Без інтернету працює тестовий розрахунок ---------- */
const Geo = {
  async json(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); },
  async reverse(p) {
    const d = await this.json("https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=uk&lat=" + p.lat + "&lon=" + p.lon);
    const a = d.address || {};
    const street = a.road || a.pedestrian || a.footway || "", house = a.house_number || "", city = a.city || a.town || a.village || "";
    return [[street, house].filter(Boolean).join(" "), city].filter(Boolean).join(", ");
  },
  async search(text, near) {
    const base = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=uk&q=" + encodeURIComponent(text);
    const tries = near ? [base + "&viewbox=" + (near.lon - 0.3) + "," + (near.lat + 0.3) + "," + (near.lon + 0.3) + "," + (near.lat - 0.3) + "&bounded=1", base] : [base];
    for (const u of tries) {
      const r = await this.json(u);
      if (r.length) return {lat: +r[0].lat, lon: +r[0].lon};
      await new Promise(s => setTimeout(s, 1000));
    }
    return null;
  },
  async route(a, b) {
    try { return (await this.json("https://router.project-osrm.org/route/v1/driving/" + a.lon + "," + a.lat + ";" + b.lon + "," + b.lat + "?overview=false")).routes[0].distance / 1000; }
    catch (e) { return roadKm(a, b); }
  },
  pseudo(text, a) {                     // тестова точка призначення за текстом адреси (лише офлайн-режим)
    let h = 0; for (const c of text) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const d = 2 + (h % 700) / 100, ang = (h % 360) * rad;
    return {lat: a.lat + d * Math.cos(ang) / 111, lon: a.lon + d * Math.sin(ang) / (111 * Math.cos(a.lat * rad))};
  },
  async quote(fromText, toText, fromPoint) {
    try {
      const a = fromPoint || await this.search(fromText);
      if (!a) return {error: "pickup"};
      const b = await this.search(toText, a);
      if (!b) return {error: "dest"};
      return {a, km: await this.route(a, b)};
    } catch (e) {
      if (!CONFIG.offlineFallback) return {error: "network"};
      const a = fromPoint || Store.get().loc;
      return {a, km: roadKm(a, this.pseudo(toText, a)), offline: true};
    }
  }
};

/* ---------- 7. Бізнес-логіка замовлень (єдина точка змін стану) ---------- */
const STATUS = {offer: ["⏳ Пропозиція водія", "#e08a00"], search: ["🔎 Пошук водія", "#e08a00"], accepted: ["🚖 Водій їде", "#2481cc"], arrived: ["✅ Водій приїхав", "#2e9d57"],
  ride: ["🚕 В дорозі", "#2481cc"], done: ["🏁 Завершено", "#2e9d57"], cancelled: ["❌ Скасовано", "#d93025"]};
const isMyDrv = o => o.mineDrv !== undefined ? o.mineDrv : !!o.driver;   // замовлення виконує саме цей водій
const drvKey = d => d.id || d.plate;               // ключ водія для списків «обрані / виключені»
// Статуси з точки зору водія
const DSTATUS = {offer: ["⏳ Очікування відповіді", "#e08a00"], accepted: ["🚗 Подача авто", "#2481cc"], arrived: ["⏳ Очікування пасажира", "#e08a00"], ride: ["⚙️ Виконання", "#2e9d57"]};
const STREETS = ["вул. Робоча", "просп. Дмитра Яворницького", "вул. Європейська", "просп. Слобожанський", "вул. Набережна Перемоги", "вул. Паторжинського", "вул. Гмирі", "просп. Героїв", "вул. Калинова", "вул. Чернишевського"];
const NAMES = ["Олена", "Андрій", "Марія", "Дмитро", "Ірина", "Сергій", "Наталя", "Віктор", "Катерина", "Максим"];
const offsetPoint = (p, kmMin, kmMax) => {
  const d = rnd(kmMin, kmMax), ang = rnd(0, 2 * Math.PI);
  return {lat: p.lat + d * Math.cos(ang) / 111, lon: p.lon + d * Math.sin(ang) / (111 * Math.cos(p.lat * rad))};

const Orders = {

  air(s) {
    const k = drvKey(s.driver);
    return s.orders.filter(o => o.status === "search" && !(o.mine && s.excluded.includes(k)) && !(s.excludedBy || []).includes(o.client.id) && !(s.blOn && s.blacklist.includes(o.client.id || o.client.name)));
  },
  allowed: role => Session.demo || Session.role === role,   // розмежування ролей (на сервері буде за Telegram ID)

      await Store.remote.blAdd(ob.client.id || ob.client.name); await Store.refresh(true); return {ok: true};
    }
    return Store.update(s => {         // чорний список пасажирів (поки лише запис; ховання в ефірі вмикається окремо)
    const o = s.orders.find(x => x.id === id); if (!o) return {error: "none"};
    const k = o.client.id || o.client.name;
    if (!s.blacklist.includes(k)) s.blacklist.push(k);
    return {ok: true};
    });
  },
  blacklistRemove: async i => { if (Store.remote) { await Store.remote.blDel(Store.get().blacklist[i]); return Store.refresh(true); } return Store.update(s => { s.blacklist.splice(i, 1); }); },
  setBlOn: v => Store.update(s => { s.blOn = v; }),
  setPhoto: (slot, data) => Store.update(s => { s.driver.photos = Object.assign({}, s.driver.photos || {}, {[slot]: data}); if (slot === "front") s.driver.photo = data; }),
  setOnline: v => Store.update(s => { s.online = v; }),
  topUp: n => Store.update(s => { s.balance += n; }),
  dismissNotice: async id => { if (Store.remote) { await Store.remote.del("wt_notices", "id=eq." + id); return Store.refresh(true); } return Store.update(s => { s.notices = s.notices.filter(n => n.id !== id); }); },
  async prefer(key, kind) {              // «обрані» / «більше не їздити»: персональні списки пасажира + агреговані лічильники водія
    if (Store.remote) {
      const changed = await Store.remote.prefer(ME, key, kind);
      if (changed && kind === "fav") Store.remote.notify("drv:" + key, "Вас додали до обраних ⭐").catch(() => {});
      await Store.refresh(true); return {ok: true};
    }
    return Store.update(s => {
      const st = s.stats[key] = s.stats[key] || {fav: 0, ex: 0};
      const fi = s.favorites.indexOf(key), ei = s.excluded.indexOf(key);
      if (kind === "fav" && fi < 0) {
        s.favorites.push(key); st.fav++;
        if (ei >= 0) { s.excluded.splice(ei, 1); st.ex = Math.max(0, st.ex - 1); }
        s.notices.push({id: Date.now(), text: "Вас додали до обраних ⭐"});
      } else if (kind === "ex" && ei < 0) {
        s.excluded.push(key); st.ex++;
        if (fi >= 0) { s.favorites.splice(fi, 1); st.fav = Math.max(0, st.fav - 1); }
      }
      return {ok: true};
    });
  }
};

const plateHtml = t => {
  const raw = String(t).replace(/\s+/g, "").toUpperCase(), m = raw.match(/^([A-ZА-ЯІЇЄ]{2})(\d{4})([A-ZА-ЯІЇЄ]{2})$/);
  const txt = m ? `<span>${m[1]}</span><span>${m[2]}</span><span>${m[3]}</span>` : `<span>${esc(raw)}</span>`;
  return `<div class="plate"><div class="ua"><div class="fl"></div><div class="ut">UA</div></div><div class="nm">${txt}</div></div>`;
};

const waitTxt = w => ({ph: w.free ? 0 : (w.idle >= CONFIG.wait.lateSec ? 2 : 1), l: w.free ? "Безкоштовне очікування" : "Час простою", t: fmtT(w.free ? w.left : w.idle),
  f: w.free ? CONFIG.wait.freeSec / 60 + " хв безкоштовно, далі ₴ " + CONFIG.wait.perMin + "/хв" : "Простій: ₴ " + w.fee + " (₴ " + CONFIG.wait.perMin + "/хв)"});
const waitBox = o => { const x = waitTxt(Timing.waitInfo(o)); return `<div class="lbl" id="wl" style="margin-top:6px;text-align:center">${x.l}</div><div class="timer sm" style="text-align:center">⏱ <span id="wt">${x.t}</span></div><div class="lbl" id="wf" style="text-align:center">${x.f}</div>`; };
const timerBox = (left, total) => `<div class="timer">⏱ <span id="cd">${fmtT(left)}</span></div><div class="bar"><i id="bar" style="width:${Math.min(100, 100 - 100 * left / total)}%"></i></div>`;
const fareTotal = o => (o.price || 0) + (o.waitFee || 0);           // вартість поїздки + простій
const fareLines = o => `<div class="row2"><span class="lbl">Вартість поїздки</span><span>₴ ${o.price}</span></div>`
  + (o.discount ? `<div class="row2"><span class="lbl">Знижка за подачу ${o.eta} хв</span><span>${o.discount}% (було ₴ ${o.origPrice})</span></div>` : "")
  + (o.waitFee ? `<div class="row2"><span class="lbl">Простій</span><span>+₴ ${o.waitFee}</span></div>` : "")
  + `<div class="row2" style="border-top:1px solid rgba(160,160,160,.35);margin-top:4px;padding-top:4px"><b>Разом</b><b style="font-size:20px">₴ ${fareTotal(o)}</b></div>`;
const orderCard = (o, cls = "") => `<div class="card ${cls}"><div class="top2"><div class="addr"><div class="lbl">📍 Звідки</div><div class="a"><b>${esc(o.from.text)}</b></div><div class="lbl">🏁 Куди</div><div class="a"><b>${esc(o.to.text)}</b></div></div>
  <div class="pr"><div class="big">₴ ${o.price}</div><div class="dd">📏 Поїздка: ${num1(o.km)} км</div>${o.discount ? '<div class="dd">знижка ' + o.discount + '%</div>' : ""}${o.waitFee ? '<div class="dd">⏱ Простій: +₴ ' + o.waitFee + '</div><div class="dd"><b>Разом: ₴ ' + fareTotal(o) + '</b></div>' : ""}</div></div></div>`;
const speedChips = s => CONFIG.speedOptions.map(v => `<button class="chip ${s.speed === v ? "on" : ""}" onclick="A.setSpeed(${v})">×${v}</button>`).join("");

const PassengerViews = {
  tabs: [["order", "📝", "Замовити"], ["trip", "🚕", "Моя поїздка"], ["hist", "🕘", "Історія"]],
  trip(s) {
    const o = Orders.mineActive(s);
    if (!o) {
      const last = s.orders.filter(x => x.mine).slice(-1)[0];
      const fin = last && last.status === "done" && last.driver ? PassengerViews.finish(s, last)
        : (last && last.cancelledBy === "driver" ? '<div class="card"><b>Водій скасував поїздку</b><div class="lbl">Через тривале очікування. Замовте таксі ще раз.</div></div>' : "");
      return fin + `<div class="empty">Активних поїздок немає.<br>Створіть замовлення на вкладці «Замовити».</div>`;
    }
    const call = o.driver ? `<a class="btn green" href="${telHref(o.driver.phone)}">📞 Зателефонувати водієві</a>` : "";
    let head, cls = "";
    if (o.status === "search") head = `<div class="big">🔎 Шукаємо водія…</div><div class="lbl">Ваше замовлення в ефірі, водії його бачать</div>`;
    else if (o.status === "offer") head = `<div class="big">⏳ Пропозиція водія</div>
      <div class="lbl" style="margin-top:6px">Водій готовий подати авто через ${o.eta} хв, але знижка від поточної вартості складе ${CONFIG.discountPct}%</div>
      <div class="big" style="margin-top:8px">₴ ${o.offerPrice} <span class="lbl" style="text-decoration:line-through">₴ ${o.price}</span></div>
      <div class="half" style="margin-top:8px"><button class="btn green" onclick="A.offer(${o.id},true)">Прийняти</button><button class="btn red" onclick="A.offer(${o.id},false)">Відмовити</button></div>`;
    else if (o.status === "accepted") {
      const t = Timing.arrLeft(o);
      head = `<div class="big">🚖 Водій їде до Вас</div><div class="lbl">Приїде через (хв)</div>${timerBox(t, o.eta * 60)}`;
    } else if (o.status === "arrived") {
      const ph = waitTxt(Timing.waitInfo(o)).ph;
      cls = ["okcard", "wait1", "wait2"][ph];
      head = `<div class="big">${["✅ Водій приїхав, виходьте", "⏰ Поспішіть, почався платний простій", "⚠️ Поспішіть, водій має право поїхати будь-коли"][ph]}</div>${waitBox(o)}${call}`;
    }
    else head = `<div class="big">🚕 Ви в дорозі</div><div class="lbl">До місця призначення залишилось (приблизно):</div>${timerBox(Timing.rideLeft(o), Timing.rideMin(o) * 60)}`;
    const d = o.driver ? `<div class="card"><div class="drow"><div class="dtxt"><div class="lbl">Водій</div><div class="val">${esc(o.driver.name)}</div>
      <div class="lbl">Авто</div><div class="val">${esc(o.driver.car)}, ${esc(o.driver.color)}</div></div>${carThumb(photosFor(s, o.driver.id).front, o.driver.id)}</div>
      <div class="lbl">Номер авто</div>${plateHtml(o.driver.plate)}
      ${o.status === "arrived" ? "" : call}</div>` : "";
    const c = ["search", "accepted"].includes(o.status) ? `<button class="btn red" onclick="A.cancel(${o.id})">Скасувати замовлення</button>` : "";
    return `<div class="card ctr ${cls}">${head}</div>${d}${orderCard(o)}${c}`;
  },
  finish(s, o) {                          // фінальна картка поїздки: обрані / виключені (без оцінок і зірок)
    const d = o.driver, k = drvKey(d), fav = s.favorites.includes(k), ex = s.excluded.includes(k);
    return `<div class="card okcard"><div class="big">🏁 Поїздку завершено</div>
      <div class="lbl">Дякуємо, що обрали Webster Taxi!</div>
      <div style="margin-top:8px">${fareLines(o)}</div></div>
      <div class="card"><div class="drow"><div class="dtxt"><div class="lbl">Водій</div><div class="val">${esc(d.name)}</div>
      <div class="lbl">Авто</div><div class="val">${esc(d.car)}, ${esc(d.color)}</div></div>${carThumb(photosFor(s, d.id).front, d.id)}</div>
      <div class="lbl">Номер авто</div>${plateHtml(d.plate)}
      <button class="btn ${fav ? "green" : ""}" ${fav ? "disabled" : ""} onclick="A.prefer('${esc(k)}','fav')">${fav ? "⭐ Водій в обраних" : "⭐ Додати водія в обрані"}</button>
      <button class="btn ${ex ? "red" : "sec"}" ${ex ? "disabled" : ""} ${ex ? "" : 'style="color:#e5655b;border-color:#e5655b"'} onclick="A.prefer('${esc(k)}','ex')">${ex ? "🚫 Водія виключено" : "🚫 Більше не їздити з цим водієм"}</button></div>`;
  },
  hist(s) {
    const l = s.orders.filter(o => o.mine && !Orders.isActive(o)).reverse();
    if (!l.length) return `<div class="empty">Історія поїздок поки порожня.</div>`;
    return l.map(o => `<div class="card"><div class="row2">${badge(o.status)}<span class="lbl">${hhmm(o.created)}</span></div>
      <div class="val" style="margin-top:6px">${esc(o.from.text)} → ${esc(o.to.text)}</div>
      <div class="lbl">${fmtKm(o.km)} · ₴ ${fareTotal(o)}</div></div>`).join("");
  }
};

const DriverViews = {
  tabs: [["air", "📡", "Ефір"], ["mine", "🚖", "Мої поїздки"], ["fin", "💰", "Фінанси"], ["prof", "👤", "Профіль"]],
  air(s) {
    if (!s.online) return `<div class="empty">Ви не на лінії.<br>Увімкніть перемикач вгорі, щоб бачити замовлення.</div>`;
    const l = Orders.air(s).map(o => ({o, d: roadKm(s.loc, o.from)})).sort((a, b) => a.d - b.d);
    const busy = !!Orders.driverActive(s);
    let h = `<div class="row2" style="margin-bottom:6px"><b>Ефір: ${l.length}</b>
      <span class="half" style="gap:6px"><button class="btn sec" style="padding:5px 10px;font-size:13px;margin:0" onclick="A.addFake(1)">＋ Тест</button><button class="btn sec" style="padding:5px 10px;font-size:13px;margin:0" onclick="A.addFake(2)">＋ Два</button></span></div>`;
    if (!l.length) h += `<div class="empty">Вільних замовлень немає.<br>Додайте тестові кнопками вище<br>або створіть замовлення як пасажир.</div>`;
    // Ім'я клієнта в ефірі не показуємо: воно з'являється в картці прийнятого замовлення («Мої поїздки»)
    return h + l.map(({o, d}) => {
      const eta = UI.etaSel[o.id] || Timing.defEta(d);
      return `<div class="card ac">
        <div class="top2"><div class="addr"><div class="a">📍 <b>${esc(o.from.text)}</b></div><div class="a">🏁 <b>${esc(o.to.text)}</b></div></div>
          <div class="pr"><div class="big">₴ ${o.price}</div><div class="dd">🚗 Подача: ${num1(d)} км</div><div class="dd">🏁 Поїздка: ${num1(o.km)} км</div></div></div>
        <div class="eta"><span class="lbl">Подача, хв${eta === CONFIG.discountEta ? " (−" + CONFIG.discountPct + "%)" : ""}</span><div class="chips">${CONFIG.etaOptions.map(m => `<button class="chip ${eta === m ? "on" : ""}" onclick="A.setEta(${o.id},${m})">${m}</button>`).join("")}</div></div>
        <button class="btn" ${busy ? "disabled" : ""} onclick="A.accept(${o.id})">${busy ? "Спочатку завершіть поточну поїздку" : "✅ Прийняти замовлення"}</button></div>`;
    }).join("");
  },
  mine(s) {
    const a = Orders.driverActive(s);
    let h = "";
    if (a) {
      let act;
      if (a.status === "offer") act = `<div class="lbl" style="text-align:center">Очікуємо відповідь пасажира: подача ${a.eta} хв, знижка ${CONFIG.discountPct}% (₴ ${a.offerPrice})</div>`;
      else if (a.status === "accepted") {
        const t = Timing.arrLeft(a), ok = Timing.canArrive(a);
        act = `<div class="lbl" style="text-align:center">Їдете до клієнта, клієнт чекає</div>${timerBox(t, a.eta * 60)}
          <button class="btn green ${ok ? "glow" : ""}" ${ok ? "" : "disabled"} onclick="A.advance(${a.id})">📍 На місці</button>
          <div class="lbl" style="text-align:center;margin-top:6px">Кнопка стане активною через ${Timing.unlockSec(a) / 60} хв після початку подачі.<br>${Session.demo ? "Демо: перевірка відстані 50 м вимкнена" : "Вона працює, коли ви ближче " + CONFIG.arriveMeters + " м до точки подачі"}</div>`;
      } else if (a.status === "arrived") {
        const late = waitTxt(Timing.waitInfo(a)).ph === 2;
        act = `${waitBox(a)}<button class="btn green glow" onclick="A.advance(${a.id})">▶ Почати поїздку</button>${late ? '<button class="btn red" onclick="A.cancelDrv(' + a.id + ')">Скасувати замовлення</button>' : ""}`;
      }
      else {
        const t = Timing.rideLeft(a);
        act = `<div class="lbl" style="text-align:center">До місця призначення залишилось (приблизно):</div>${timerBox(t, Timing.rideMin(a) * 60)}
          <button class="btn green ${t <= 0 ? "glow" : ""}" ${t > 0 ? "disabled" : ""} onclick="A.advance(${a.id})">🏁 Завершити поїздку</button>`;
      }
      h += `<div class="card"><div class="row2">${dbadge(a.status)}<span class="lbl">подача ~${a.eta} хв</span></div>
        <div class="lbl" style="margin-top:8px">Клієнт</div><div class="val">${esc(a.client.name)}</div><a class="btn sec" href="${telHref(a.client.phone)}">📞 Зателефонувати</a></div>
        <div class="card ctr">${act}</div>${orderCard(a, "okcard")}`;
    } else h += `<div class="empty">Активної поїздки немає.<br>Прийміть замовлення на вкладці «Ефір».</div>`;
    const done = s.orders.filter(o => isMyDrv(o) && o.status === "done").reverse();
    h += `<div class="row2" style="margin:14px 0 6px"><b>Історія</b><span class="lbl">${done.length} поїздок · ₴ ${done.reduce((x, o) => x + o.price + (o.waitFee || 0), 0)}</span></div>`;
    return h + done.map(o => DriverViews.tripPlate(o)).join("");
  },
  tripPlate(o) {                          // коротка плашка завершеної поїздки; по натисканню розкривається
    const open = !!UI.open[o.id], st = Store.get(), key = o.client.id || o.client.name, bl = st.blacklist.includes(key);
    const dt = new Date(o.created).toLocaleDateString("uk-UA") + " " + hhmm(o.created);
    const head = `<div class="row2" onclick="A.toggleTrip(${o.id})" style="cursor:pointer"><b>${dt}</b><span><span class="val">₴ ${fareTotal(o)}</span> <span class="lbl">${open ? "▴" : "▾"}</span></span></div>`;
    if (!open) return `<div class="card tp">${head}<div class="lbl" style="margin-top:4px">${esc(o.from.text)} → ${esc(o.to.text)}</div></div>`;
    const react = [o.compliment ? "💛 Комплімент надіслано" : "", bl ? "⛔ Пасажир у чорному списку" : ""].filter(Boolean).join(" · ") || "Реакції немає";
    return `<div class="card tp">${head}
      <div class="lbl" style="margin-top:8px">Клієнт</div><div class="val">${esc(o.client.name)}</div>
      <div class="top2"><div class="addr"><div class="lbl">📍 Звідки</div><div class="a"><b>${esc(o.from.text)}</b></div><div class="lbl">🏁 Куди</div><div class="a"><b>${esc(o.to.text)}</b></div></div>
        <div class="pr"><div class="big">₴ ${fareTotal(o)}</div><div class="dd">📏 Поїздка: ${num1(o.km)} км</div></div></div>
      <div style="margin-top:8px">${fareLines(o)}<div class="row2"><span class="lbl">Комісія платформи (${CONFIG.commissionPct}%)</span><span>−₴ ${o.commission || 0}</span></div></div>
      <div class="lbl" style="margin-top:6px">Завершено: ${hhmm(o.doneAt)}</div>
      <div class="lbl">Реакція: ${react}</div>
      <button class="btn ${o.compliment ? "green" : ""}" ${o.compliment ? "disabled" : ""} onclick="A.compliment(${o.id})">${o.compliment ? "💛 Комплімент надіслано" : "💛 Зробити комплімент пасажиру"}</button>
      <button class="btn sec" style="color:#e5655b;border-color:#e5655b" ${bl ? "disabled" : ""} onclick="A.blacklist(${o.id})">${bl ? "⛔ У чорному списку" : "⛔ Додати до чорного списку"}</button></div>`;
  },
  fin(s) {
    const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const w0 = d0 - ((now.getDay() + 6) % 7) * 864e5, m0 = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    const done = s.orders.filter(o => isMyDrv(o) && o.status === "done");
    const per = (t, from) => {
      const l = done.filter(o => (o.doneAt || 0) >= from);
      const sum = l.reduce((x, o) => x + (o.fare || o.price), 0), com = l.reduce((x, o) => x + (o.commission || 0), 0);
      return `<div class="card"><div class="row2"><b>${t}</b><span class="lbl">Поїздок: ${l.length}</span></div>
        <div class="row2" style="margin-top:6px"><span class="lbl">Сума замовлень</span><span>₴ ${sum}</span></div>
        <div class="row2"><span class="lbl">Комісія платформи</span><span>−₴ ${com}</span></div>
        <div class="row2"><span class="lbl">Чистий заробіток</span><b style="font-size:20px">₴ ${sum - com}</b></div></div>`;
    };
    const hist = done.slice().reverse().slice(0, 15).map(o => `<div class="card"><div class="row2"><span>${new Date(o.doneAt).toLocaleDateString("uk-UA")} ${hhmm(o.doneAt)}</span><b>−₴ ${o.commission || 0}</b></div>
      <div class="lbl">Замовлення ₴ ${o.fare || o.price} · комісія ${CONFIG.commissionPct}%</div></div>`).join("");
    return `<div class="card"><div class="lbl">Баланс водія (тестова сума)</div>
      <div class="price" style="color:${s.balance < 0 ? "#ff6b60" : "inherit"}">₴ ${s.balance}</div>
      <div class="lbl">З балансу списується комісія ${CONFIG.commissionPct}% за кожне виконане замовлення (тестовий відсоток)</div>
      <button class="btn sec" onclick="A.topUp(500)">＋ Поповнити на ₴ 500 (демо)</button></div>
      ${per("Сьогодні", d0)}${per("Цей тиждень", w0)}${per("Цей місяць", m0)}
      <div class="row2" style="margin:14px 0 6px"><b>Списання комісії</b></div>${hist || '<div class="empty">Списань поки немає.</div>'}`;
  },
  prof(s) {
    const d = s.driver, st = s.stats[drvKey(d)] || {fav: 0, ex: 0};
    const f = (k, t) => `<label>${t}</label><input value="${esc(d[k])}" onchange="A.setDriver('${k}',this.value)">`;
    return `<div class="card pf"><div class="row2"><b>Профіль водія</b><span class="badge" style="background:#2e9d57">✅ Підтверджено (демо)</span></div>
      <div class="drow"><div class="dtxt">${f("name", "Ім'я")}${f("car", "Марка та модель авто")}</div>${carThumb(drvPhotos(d).front)}</div>
      <div class="lbl" style="margin-top:8px">Фото авто для пасажира (тап по фото відкриває всі три)</div>
      <div class="chips">${[["front", "Спереду"], ["rear", "Ззаду"], ["side", "Збоку"]].map(([k, t]) => `<label class="chip" style="text-align:center;margin:0">${drvPhotos(d)[k] ? "✅" : "📷"} ${t}<input type="file" accept="image/*" style="display:none" onchange="A.setPhoto(this,'${k}')"></label>`).join("")}</div>
      ${f("color", "Колір")}
      <label>Державний номер</label>${plateHtml(d.plate)}
      <button class="btn sec" style="margin-top:0" onclick="A.editPlate()">✏️ Змінити номер</button>
      ${f("phone", "Телефон")}
      <div class="lbl" style="margin-top:8px">Пізніше ці дані підтягнуться з реєстрації в групі.</div></div>
      <div class="card"><div class="lbl">Вподобання пасажирів (загальна кількість)</div>
        <div class="row2" style="margin-top:6px"><span>⭐ Додали в обрані</span><b>${st.fav}</b></div>
        <div class="row2"><span>🚫 Більше не їздять</span><b>${st.ex}</b></div></div>
      <div class="card"><div class="row2"><b>⛔ Чорний список пасажирів</b><span class="lbl">${s.blacklist.length}</span></div>
        <div class="lbl" style="margin-top:4px">У тестовій версії чорний список не ховає замовлення в ефірі, щоб можна було тестувати. Вмикається нижче.</div>
        ${s.blacklist.map((k, i) => `<div class="row2" style="margin-top:6px"><span>${esc(k)}</span><button class="chip" style="flex:none;padding:4px 12px" onclick="A.unbl(${i})">✖</button></div>`).join("")}
        <button class="btn sec" onclick="A.toggleBl()">Ховати в ефірі: ${s.blOn ? "увімкнено" : "вимкнено"}</button></div>
      <div class="card"><div class="lbl">Швидкість часу (демо): ×1 це реальний час</div><div class="chips">${speedChips(s)}</div></div>
      <div class="card"><div class="lbl">Точка для розрахунку відстаней</div><div class="val">${s.loc.real ? "Ваша геолокація" : "Центр Дніпра (демо)"}</div>
        <button class="btn sec" onclick="A.locate()">📍 Оновити геолокацію</button></div>
      <button class="btn red" onclick="A.reset()">Скинути демо-дані</button>`;
  }
};
const Views = {pass: PassengerViews, drv: DriverViews};

/* ---------- 9. Інтерфейс: відмальовування і таймер ---------- */
const UI = {
  etaSel: {}, open: {}, from: null, result: null, lastKey: "",
  inForm: () => Session.role === "pass" && Session.tab.pass === "order",
  safe() { return !this.inForm() && Session.tab[Session.role] !== "prof"; },
  render() {
    const s = Store.get(), V = Views[Session.role], cur = Session.tab[Session.role];
    if (Session.demo) {
      $("demoBar").style.display = "block";
      $("seg").innerHTML = [["pass", "🧍 Пасажир"], ["drv", "🚖 Водій"]].map(([r, t]) => `<button class="${Session.role === r ? "on" : ""}" onclick="A.setRole('${r}')">${t}</button>`).join("");
      $("spd").innerHTML = speedChips(s);
    }
    const air = Orders.air(s).length;
    $("tabs").innerHTML = V.tabs.map(([k, ic, t]) => `<button class="${cur === k ? "on" : ""}" onclick="A.setTab('${k}')"><span class="ic">${ic}</span>${t}${k === "air" && air ? " (" + air + ")" : ""}</button>`).join("");
    $("orderForm").style.display = this.inForm() ? "block" : "none";
    $("pTop").innerHTML = Session.role === "pass" ? passTop(s) : "";
    $("view").innerHTML = this.inForm() ? "" : (Session.role === "drv" ? driverTop(s) : "") + V[cur](s);
  },
  tick() {                               // раз на секунду: оновлює лише цифри і смужку, не чіпає кнопки
    const s = Store.get(), o = Session.role === "pass" ? Orders.mineActive(s) : Orders.driverActive(s);
    let key = o ? o.status : "";
    if (o && (o.status === "accepted" || o.status === "ride")) {
      const left = o.status === "accepted" ? Timing.arrLeft(o) : Timing.rideLeft(o);
      const total = o.status === "accepted" ? o.eta * 60 : Timing.rideMin(o) * 60;
      if (o.status === "accepted" ? Timing.canArrive(o) : left <= 0) key += "!";
      const e = $("cd"), b = $("bar");
      if (e && left > 0) e.textContent = fmtT(left);
      if (b) b.style.width = Math.min(100, 100 - 100 * left / total) + "%";
    }
    if (o && o.status === "arrived") {
      const x = waitTxt(Timing.waitInfo(o)), l = $("wl"), e = $("wt"), f = $("wf");
      if (l) l.textContent = x.l; if (e) e.textContent = x.t; if (f) f.textContent = x.f;
      key += ":" + x.ph;
    }
    if (key !== this.lastKey) { this.lastKey = key; if (this.safe()) this.render(); }
  }
};

/* ---------- 10. Дії користувача ---------- */
const ALREADY = "Ви вже замовили таксі. Можливість замовити наступну поїздку з'явиться після завершення поточної поїздки чи поточного замовлення.";
const A = {
  setRole(r) { Session.role = r; UI.render(); },
  setTab(k) { Session.tab[Session.role] = k; UI.render(); window.scrollTo(0, 0); },
  setEta(id, m) { UI.etaSel[id] = m; UI.render(); },
  async accept(id) {
    const s = Store.get(), o = s.orders.find(x => x.id === id);
    const eta = UI.etaSel[id] || (o ? Timing.defEta(roadKm(s.loc, o.from)) : 5);
    const r = await Orders.accept(id, eta);
    if (r.ok) { Session.tab.drv = "mine"; if (r.offer) notify("Пропозицію надіслано пасажиру. Чекаємо на його відповідь."); }
    else if (r.error === "offline") notify("Ви не на лінії. Увімкніть перемикач вгорі.");
    UI.render();
  },
  async advance(id) {
    const o0 = Store.get().orders.find(x => x.id === id);
    if (o0 && o0.status === "accepted" && !Session.demo && o0.from && o0.from.lat != null) {      // «На місці»: не далі 50 м від точки подачі
      const d = await new Promise(res => navigator.geolocation
        ? navigator.geolocation.getCurrentPosition(p => res(hav({lat: p.coords.latitude, lon: p.coords.longitude}, o0.from) * 1000), () => res(null), {enableHighAccuracy: true, timeout: 12000})
        : res(null));
      if (d === null) { notify("Не вдалося визначити ваше місцезнаходження. Увімкніть геолокацію."); return; }
      if (d > CONFIG.arriveMeters) { notify("Ви ще далеко від точки подачі (" + Math.round(d) + " м). Під'їдьте ближче ніж на " + CONFIG.arriveMeters + " м."); return; }
    }
    await Orders.advance(id);
    const o = Store.get().orders.find(x => x.id === id);
    if (o && o.status === "done") UI.open[id] = true;                // щойно завершену поїздку показуємо розкритою
    UI.render();
  },
  async offer(id, ok) { await Orders.answerOffer(id, ok); UI.render(); },
  toggleTrip(id) { UI.open[id] = !UI.open[id]; UI.render(); },
  async blacklist(id) { await Orders.blacklistAdd(id); UI.render(); },
  async unbl(i) { await Orders.blacklistRemove(i); UI.render(); },
  async toggleBl() { await Orders.setBlOn(!Store.get().blOn); UI.render(); },
  async cancel(id) { await Orders.cancel(id); UI.render(); },
  async addFake(n) { await Orders.addFake(n); },
  async setSpeed(v) { await Orders.setSpeed(v); UI.render(); },
  async setDriver(k, v) { await Orders.setDriver(k, v); if (k === "plate") UI.render(); },
  async toggleOnline() { await Orders.setOnline(!Store.get().online); UI.render(); },
  async dismiss(id) { await Orders.dismissNotice(id); UI.render(); },
  async prefer(k, kind) { await Orders.prefer(k, kind); UI.render(); },
  async topUp(n) { await Orders.topUp(n); UI.render(); },
  async compliment(id) { await Orders.compliment(id); UI.render(); },
  async dismissP(id) { await Orders.dismissPNotice(id); UI.render(); },
  async cancelDrv(id) { await Orders.cancelByDriver(id); UI.render(); },
  zoom(id) {                                // усі три фото авто на одному екрані; закривається дотиком
    const p = photosFor(Store.get(), id), z = $("zoom");
    const item = (src, cap) => `<div class="zi">${src ? '<img src="' + src + '" alt="">' : '<div class="zph">' + CAR_SVG + '</div>'}<div class="zc">${cap}</div></div>`;
    z.innerHTML = item(p.front, "Спереду") + item(p.rear || DEMO_PHOTOS.rear, "Ззаду") + item(p.side || DEMO_PHOTOS.side, "Збоку");
    z.style.display = "flex";
  },
  editPlate() {
    const v = prompt("Державний номер (наприклад, AA 0888 TK)", Store.get().driver.plate);
    if (v && v.trim()) Orders.setDriver("plate", v.trim().toUpperCase()).then(() => UI.render());
  },
  setPhoto(inp, slot) {                   // фото авто (спереду / ззаду / збоку): стискаємо і зберігаємо в профілі водія
    const f = inp.files && inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const w = Math.min(640, im.width), h = Math.round(im.height * w / im.width), c = document.createElement("canvas");
        c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
        Orders.setPhoto(slot, c.toDataURL("image/jpeg", 0.75)).then(() => UI.render());
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  },
  async reset() { if (confirm("Скинути всі демо-дані?")) { await Orders.reset(); UI.render(); } },
  locate() {
    const hint = $("fromHint");
    hint.textContent = "Визначаємо ваше місцезнаходження…";
    if (!navigator.geolocation) { hint.textContent = "Геолокація недоступна — введіть адресу вручну"; return; }
    navigator.geolocation.getCurrentPosition(async p => {
      UI.from = {lat: p.coords.latitude, lon: p.coords.longitude};
      await Orders.setLoc(UI.from);
      if (Session.tab[Session.role] === "prof") UI.render();
      try { $("from").value = await Geo.reverse(UI.from); hint.textContent = "Визначено за геолокацією"; }
      catch (e) { hint.textContent = "Координати отримано, адресу не визначено — введіть вручну"; }
    }, () => { hint.textContent = "Не вдалося визначити місце — введіть адресу вручну"; }, {enableHighAccuracy: true, timeout: 15000});
  },
  async calc() {
    if (Orders.mineActive(Store.get())) { notify(ALREADY); return; }
    const fromText = $("from").value.trim(), toText = $("to").value.trim();
    $("err").textContent = ""; $("res").style.display = "none";
    if (!fromText || !toText) { $("err").textContent = "Введіть обидві адреси."; return; }
    $("calcBtn").disabled = true; $("calcBtn").textContent = "⏳ Секундочку, рахуємо вартість поїздки…";
    const q = await Geo.quote(fromText, toText, UI.from);
    if (q.error === "pickup") $("err").textContent = "⚠️ Можливо, адреси подачі не існує.";
    else if (q.error === "dest") $("err").textContent = "⚠️ Можливо, такої адреси не існує. Перевірте та спробуйте ще раз.";
    else if (q.error) $("err").textContent = "Не вдалося розрахувати. Перевірте інтернет і спробуйте ще раз.";
    else {
      const km = Math.round(q.km * 10) / 10;
      UI.result = {from: fromText, to: toText, km, price: Tariff.price(q.km), lat: q.a.lat, lon: q.a.lon};
      $("price").textContent = "~₴ " + UI.result.price;
      $("dist").textContent = "Відстань: ~" + km + " км" + (q.offline ? " · тестовий розрахунок без інтернету" : "");
      $("res").style.display = "block";
      $("res").scrollIntoView({behavior: "smooth", block: "end"});
    }
    $("calcBtn").disabled = false; $("calcBtn").textContent = "Розрахувати вартість";
  },
  async order() {
    if (!UI.result) return;
    const r = await Orders.create(UI.result);
    if (r.error === "active") { notify(ALREADY); return; }
    if (r.ok) { UI.result = null; $("res").style.display = "none"; $("to").value = ""; }
    Session.tab.pass = "trip"; UI.render(); window.scrollTo(0, 0);
  }
};

/* ---------- 11. Запуск ---------- */
Store.init();
Store.subscribe(() => { if (UI.safe()) UI.render(); });
$("from").addEventListener("input", () => { UI.from = null; $("fromHint").textContent = ""; });
setInterval(() => UI.tick(), 1000);
UI.render();
A.locate();
</script>
