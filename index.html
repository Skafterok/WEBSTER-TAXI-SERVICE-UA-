<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Webster Taxi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#888);--btn:var(--tg-theme-button-color,#2481cc);--btx:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f1f3f5)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:16px 16px 32px}
h1{font-size:22px;margin:4px 0 16px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--hint);margin-bottom:4px}
input{width:100%;border:0;background:transparent;color:var(--tx);font-size:17px;font-weight:600;padding:6px 0;outline:none}
.hint{font-size:12px;color:var(--hint);min-height:16px}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:600;background:var(--btn);color:var(--btx)}
button:disabled{opacity:.5}
.price{font-size:34px;font-weight:700}
.err{color:#d93025;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<h1>🚕 Webster Taxi</h1>

<div class="card">
  <label>📍 Откуда</label>
  <input id="from" placeholder="Улица и номер дома" autocomplete="off">
  <div class="hint" id="fromHint"></div>
</div>

<div class="card">
  <label>🏁 Куда</label>
  <input id="to" placeholder="Например: улица Заводская 50" autocomplete="off">
</div>

<button id="calcBtn" onclick="calc()">Рассчитать стоимость</button>

<div id="res" style="display:none">
  <div class="card" style="margin-top:12px">
    <label>💰 Стоимость поездки</label>
    <div class="price" id="price"></div>
    <div class="hint" id="dist"></div>
  </div>
  <button id="orderBtn" onclick="order()">✅ Заказать такси</button>
</div>

<div class="err" id="err"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const inTG = !!(tg && tg.initData);
const $ = id => document.getElementById(id);
let from = null, result = null;

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const sleep = ms => new Promise(s => setTimeout(s, ms));

function shortAddr(a) {
  const street = a.road || a.pedestrian || a.footway || "";
  const house = a.house_number || "";
  const city = a.city || a.town || a.village || "";
  return [[street, house].filter(Boolean).join(" "), city].filter(Boolean).join(", ");
}

function locate() {
  $("fromHint").textContent = "Определяем ваше местоположение…";
  if (!navigator.geolocation) {
    $("fromHint").textContent = "Геолокация недоступна — введите адрес вручную";
    return;
  }
  navigator.geolocation.getCurrentPosition(async p => {
    from = { lat: p.coords.latitude, lon: p.coords.longitude };
    try {
      const d = await getJSON("https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=ru&lat=" + from.lat + "&lon=" + from.lon);
      $("from").value = shortAddr(d.address || {});
      $("fromHint").textContent = "Определено по геолокации";
    } catch (e) {
      $("fromHint").textContent = "Координаты получены, адрес не определён — введите вручную";
    }
  }, () => {
    $("fromHint").textContent = "Не удалось определить место — введите адрес вручную";
  }, { enableHighAccuracy: true, timeout: 15000 });
}

async function geocode(text, near) {
  const base = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ru&q=" + encodeURIComponent(text);
  const tries = near
    ? [base + "&viewbox=" + (near.lon - 0.3) + "," + (near.lat + 0.3) + "," + (near.lon + 0.3) + "," + (near.lat - 0.3) + "&bounded=1", base]
    : [base];
  for (const u of tries) {
    const r = await getJSON(u);
    if (r.length) return { lat: +r[0].lat, lon: +r[0].lon };
    await sleep(1000);
  }
  return null;
}

async function routeKm(a, b) {
  try {
    const d = await getJSON("https://router.project-osrm.org/route/v1/driving/" + a.lon + "," + a.lat + ";" + b.lon + "," + b.lat + "?overview=false");
    return d.routes[0].distance / 1000;
  } catch (e) {
    const p = Math.PI / 180;
    const h = Math.sin((b.lat - a.lat) * p / 2) ** 2 + Math.cos(a.lat * p) * Math.cos(b.lat * p) * Math.sin((b.lon - a.lon) * p / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(h)) * 1.3;
  }
}

const priceFor = km => 150 + Math.ceil(Math.max(0, km - 2) * 2) * 8;

async function calc() {
  const fromText = $("from").value.trim(), toText = $("to").value.trim();
  $("err").textContent = "";
  $("res").style.display = "none";
  if (!fromText || !toText) { $("err").textContent = "Введите оба адреса."; return; }
  $("calcBtn").disabled = true;
  $("calcBtn").textContent = "⏳ Секундочку, считаем…";
  try {
    let a = from || await geocode(fromText, null);
    if (!a) { $("err").textContent = "⚠️ Возможно, адреса подачи не существует."; return; }
    const b = await geocode(toText, a);
    if (!b) { $("err").textContent = "⚠️ Возможно, такого адреса не существует. Проверьте и попробуйте ещё раз."; return; }
    const km = await routeKm(a, b);
    result = { from: fromText, to: toText, km: Math.round(km * 10) / 10, price: priceFor(km), lat: a.lat, lon: a.lon };
    $("price").textContent = "~" + result.price + " грн";
    $("dist").textContent = "Расстояние: ~" + result.km + " км";
    $("res").style.display = "block";
  } catch (e) {
    $("err").textContent = "Не удалось рассчитать. Проверьте интернет и попробуйте ещё раз.";
  } finally {
    $("calcBtn").disabled = false;
    $("calcBtn").textContent = "Рассчитать стоимость";
  }
}

function order() {
  if (!result) return;
  if (inTG) {
    tg.sendData(JSON.stringify(result));
    return;
  }
  alert("Тест в браузере: заказ не отправляется.\n\n" + result.from + " → " + result.to + "\n~" + result.km + " км, ~" + result.price + " грн\n\nВнутри Telegram эта кнопка отправит заказ боту.");
}

$("from").addEventListener("input", () => { from = null; $("fromHint").textContent = ""; });
locate();
</script>
</body>
</html>
